name: Build original HASNITECH app (corrected baseline)

on:
  push:
    branches: [qemu-integration-corrected]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-original-app:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout HASNITECH source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build the actual HASNITECH app module
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify original package and launcher identity
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/badging.txt
          grep -F "package: name='com.hasnitech.launcher'" /tmp/badging.txt
          grep -F "application-label:'HASNITECH'" /tmp/badging.txt
          unzip -t "$APK" | tail -n 2

      - name: Upload original HASNITECH debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HASNITECH-original-ui-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
